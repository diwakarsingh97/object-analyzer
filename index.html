<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Object Analyzer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #05070b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 94%;
    max-width: 950px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #9299a8;
    margin: 8px 0 25px;
}

.camera-container {
    position: relative;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #242a35;
}

video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #000;
}

.camera-message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    pointer-events: none;
}

video:not([data-active="true"]) {
    opacity: 0.2;
}

.scan-frame {
    position: absolute;
    width: 55%;
    height: 55%;
    left: 22.5%;
    top: 22.5%;
    border: 2px solid rgba(0, 255, 150, 0.8);
    border-radius: 12px;
    pointer-events: none;
    display: none;
}

.scanning .scan-frame {
    display: block;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: .3;
    }

    50% {
        opacity: 1;
    }
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
}

button {
    padding: 13px 22px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#start {
    background: #00d084;
    color: #00150d;
}

#analyze {
    background: #248cff;
    color: white;
}

#stop {
    background: #252b35;
    color: white;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.status {
    padding: 14px;
    background: #111620;
    border: 1px solid #222936;
    border-radius: 10px;
    text-align: center;
    color: #aeb5c2;

<body>

<div class="container">

<h1>🔬 AI Object Analyzer</h1>

<div class="subtitle">
Show an object to the camera and let AI analyze it
</div>


<div class="camera-container" id="cameraContainer">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <div class="camera-message" id="cameraMessage">
        Camera starting...
    </div>

    <div class="scan-frame"></div>

</div>


<div class="status" id="status">
    Loading AI model...
</div>

<div class="loader" id="loader"></div>


<div class="controls">

    <button id="start">
        📷 Start Camera
    </button>

    <button id="analyze" disabled>
        🔍 Analyze Object
    </button>

    <button id="stop" disabled>
        ⛔ Stop
    </button>

</div>


<div class="result">

    <div class="result-title">
        AI Result
    </div>

    <div class="object-name" id="objectName">
        Waiting...
    </div>

    <div class="description" id="description">
        Start the camera and place an object in front of it.
    </div>

    <div class="badge" id="badge">
        AI Vision
    </div>

</div>


<canvas id="canvas"></canvas>


<div class="info">
    The first AI model download may take some time.
</div>

</div>


<script type="module">

/*
==================================================
AI LIBRARY
==================================================
*/

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/+esm";


/*
==================================================
ELEMENTS
==================================================
*/

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("start");

const analyzeButton =
    document.getElementById("analyze");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const objectName =
    document.getElementById("objectName");

const description =
    document.getElementById("description");

const badge =
    document.getElementById("badge");

const loader =
    document.getElementById("loader");

const cameraContainer =
    document.getElementById("cameraContainer");

const cameraMessage =
    document.getElementById("cameraMessage");


/*
==================================================
VARIABLES
==================================================
*/

let stream = null;

let ai = null;

let analyzing = false;


/*
==================================================
LOAD AI
==================================================
*/

async function loadAI() {

    try {

        status.textContent =
            "🧠 Loading AI vision model...";

        /*
        This model runs inside the browser.

        It generates a description of an image
        instead of restricting us to a fixed
        object list.
        */

        ai = await pipeline(
            "image-to-text",
            "Xenova/vit-gpt2-image-captioning"
        );


        status.textContent =
            "✅ AI ready. Starting camera...";

        /*
        Start camera automatically.
        */

        await startCamera();

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "⚠️ AI failed to load. Camera can still be used.";

        /*
        Even if AI fails, start camera.
        */

        await startCamera();

    }

}


/*
==================================================
START CAMERA
==================================================
*/

async function startCamera() {

    try {

        /*
        Check browser support.
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API unavailable. Use HTTPS."
            );

        }


        /*
        Don't create another camera stream
        if one already exists.
        */

        if (stream) {

            return;

        }


        status.textContent =
            "📷 Requesting camera permission...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject = stream;

        video.setAttribute(
            "data-active",
            "true"
        );


        await video.play();


        cameraMessage.style.display =
            "none";


        startButton.disabled =
            true;

        stopButton.disabled =
            false;

        analyzeButton.disabled =
            !ai;


        status.textContent =
            "🟢 Camera ready — put an object in front of it.";

    }

    catch (error) {

        console.error(error);

        cameraMessage.textContent =
            "Camera permission required";

        status.textContent =
            "❌ Camera error: " + error.message;

        /*
        Helpful error for GitHub Pages.
        */

        if (
            error.name ===
            "NotAllowedError"
        ) {

            status.textContent =
                "❌ Camera permission denied. Click the camera icon in Chrome's address bar and allow camera access.";

        }

        if (
            error.name ===
            "NotFoundError"
        ) {

            status.textContent =
                "❌ No camera was found on this device.";

        }

    }

}


/*
==================================================
STOP CAMERA
==================================================
*/

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }


    video.srcObject = null;

    video.removeAttribute(
        "data-active"
    );

    cameraMessage.style.display =
        "flex";

    cameraMessage.textContent =
        "Camera stopped";


    startButton.disabled =
        false;

    stopButton.disabled =
        true;

    analyzeButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/*
==================================================
CAPTURE FRAME
==================================================
*/

function captureFrame() {

    if (!stream) {

        throw new Error(
            "Camera is not running."
        );

    }


    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        throw new Error(
            "Camera frame is not ready yet."
        );

    }


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext("2d");


    /*
    Mirror correction.

    Because laptop webcam preview is
    normally mirrored, we capture the
    actual image orientation.
    */

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas;

}


/*
==================================================
ANALYZE CAMERA
==================================================
*/

async function analyzeObject() {

    if (!ai) {

        status.textContent =
            "AI model is not ready yet.";

        return;

    }


    if (!stream) {

        status.textContent =
            "Start the camera first.";

        return;

    }


    if (analyzing) {

        return;

    }


    analyzing = true;


    analyzeButton.disabled =
        true;

    cameraContainer.classList.add(
        "scanning"
    );


    loader.style.display =
        "block";


    status.textContent =
        "🔍 AI is analyzing the object...";


    objectName.textContent =
        "Analyzing...";


    description.textContent =
        "Please wait while the AI examines the camera image.";

    badge.textContent =
        "Scanning";


    try {

        /*
        Capture current camera frame.
        */

        const image =
            captureFrame();


        /*
        Run AI.
        */

        const result =
            await ai(image, {

                max_new_tokens: 35

            });


        console.log(
            "AI RESULT:",
            result
        );


        if (
            !result ||
            !result.length ||
            !result[0].generated_text
        ) {

            throw new Error(
                "AI returned no result."
            );

        }


        /*
        Get generated description.
        */

        let text =
            result[0].generated_text.trim();


        /*
        Capitalize first letter.
        */

        text =
            text.charAt(0).toUpperCase() +
            text.slice(1);


        /*
        Display result.
        */

        objectName.textContent =
            text;


        description.textContent =
            "AI analysis: " + text;


        /*
        Basic category detection.
        This does NOT limit the AI's recognition.
        */

        const lower =
            text.toLowerCase();


        if (
            /\b(person|man|woman|boy|girl|human|people)\b/
            .test(lower)
        ) {

            badge.textContent =
                "👤 HUMAN";

        }

        else if (
            /\b(dog|cat|bird|horse|cow|sheep|goat|elephant|bear|zebra|giraffe|rabbit|monkey|animal)\b/
            .test(lower)
        ) {

            badge.textContent =
                "🐾 ANIMAL";

        }

        else {

            badge.textContent =
                "📦 OBJECT";

        }


        status.textContent =
            "✅ Analysis complete.";


    }

    catch (error) {

        console.error(error);


        objectName.textContent =
            "Unable to identify";


        description.textContent =
            "The AI could not confidently describe this image. Try moving the object closer, improving lighting, or keeping the object clearly visible.";


        badge.textContent =
            "Try Again";


        status.textContent =
            "⚠️ Analysis failed.";

    }


    loader.style.display =
        "none";


    cameraContainer.classList.remove(
        "scanning"
    );


    analyzeButton.disabled =
        false;


    analyzing = false;

}


/*
==================================================
BUTTONS
==================================================
*/

startButton.addEventListener(
    "click",
    startCamera
);


analyzeButton.addEventListener(
    "click",
    analyzeObject
);


stopButton.addEventListener(
    "click",
    stopCamera
);


/*
==================================================
CLEANUP
==================================================
*/

window.addEventListener(
    "beforeunload",
    stopCamera
);


/*
==================================================
START EVERYTHING
==================================================
*/

loadAI();

</script>

</body>
</html>
