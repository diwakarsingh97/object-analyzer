<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Analyzer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 900px;
    margin: 30px auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #9da5b4;
    margin-bottom: 20px;
}

.camera {
    position: relative;
    width: 100%;
    background: black;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    background: black;
    min-height: 300px;
    object-fit: cover;
}

.controls {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

#start {
    background: #00d084;
}

#scan {
    background: #298cff;
    color: white;
}

#stop {
    background: #333b48;
    color: white;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.status {
    padding: 12px;
    background: #111722;
    border-radius: 10px;
    margin-bottom: 15px;
}

.result {
    text-align: left;
    background: #111722;
    padding: 20px;
    border-radius: 12px;
}

.result h2 {
    margin-top: 0;
}

.name {
    font-size: 25px;
    color: #00d084;
    font-weight: bold;
}

.description {
    margin-top: 10px;
    color: #c8ced8;
    line-height: 1.6;
}

canvas {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🔬 AI Object Analyzer</h1>

<div class="subtitle">
Put any object, human or animal in front of your camera
</div>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
</div>

<div class="controls">

    <button id="start">
        📷 Start Camera
    </button>

    <button id="scan" disabled>
        🔍 Analyze Object
    </button>

    <button id="stop" disabled>
        ⛔ Stop Camera
    </button>

</div>

<div class="status" id="status">
    Camera is not started.
</div>

<div class="result">

<h2>Analysis</h2>

<div class="name" id="name">
    Waiting...
</div>

<div class="description" id="description">
    Start the camera and show something in front of it.
</div>

</div>

<canvas id="canvas"></canvas>

</div>


<script>

const video = document.getElementById("video");

const startButton = document.getElementById("start");
const scanButton = document.getElementById("scan");
const stopButton = document.getElementById("stop");

const statusText = document.getElementById("status");

const resultName = document.getElementById("name");
const resultDescription = document.getElementById("description");

const canvas = document.getElementById("canvas");

let cameraStream = null;


/* ================================
   START CAMERA
================================ */

async function startCamera() {

    statusText.innerText = "Requesting camera permission...";

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Camera API is not available. Open this website using HTTPS."
            );
        }


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = cameraStream;

        await video.play();


        statusText.innerText =
            "🟢 Camera is working. Show an object.";

        startButton.disabled = true;

        scanButton.disabled = false;

        stopButton.disabled = false;


    } catch (error) {

        console.error(error);

        statusText.innerText =
            "❌ Camera error: " + error.message;

        alert(
            "Camera could not start.\n\n" +
            "Make sure you:\n" +
            "1. Allow camera permission\n" +
            "2. Use HTTPS / GitHub Pages\n" +
            "3. Don't open the file directly from your computer\n\n" +
            "Error: " + error.message
        );

    }

}


/* ================================
   STOP CAMERA
================================ */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;
    }

    video.srcObject = null;

    startButton.disabled = false;

    scanButton.disabled = true;

    stopButton.disabled = true;

    statusText.innerText =
        "Camera stopped.";

}


/* ================================
   CAPTURE IMAGE
================================ */

function captureImage() {

    if (!cameraStream) {

        alert("Start the camera first.");

        return null;
    }

    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        alert("Camera is not ready yet.");

        return null;
    }


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    const context =
        canvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.85
    );

}


/* ================================
   TEMPORARY ANALYZER
================================ */

function analyzeObject() {

    const image = captureImage();

    if (!image) {
        return;
    }


    /*
       CAMERA IS NOW CONFIRMED WORKING.

       The next step is connecting this image
       to a real vision AI model.
    */


    resultName.innerText =
        "Image captured successfully ✅";


    resultDescription.innerText =
        "Your camera is working. The next step is connecting this captured image to an open-ended vision AI model that can identify arbitrary objects.";

    statusText.innerText =
        "📸 Image captured.";

}


/* ================================
   BUTTON EVENTS
================================ */

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


scanButton.addEventListener(
    "click",
    analyzeObject
);


/* ================================
   CLEANUP
================================ */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
